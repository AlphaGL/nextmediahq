<!-- SUBJECT FORM TEMPLATE -->
<!-- learning/templates/learning/admin/subject_form.html -->
<!-- =========================== -->
{% extends 'learning/admin/base.html' %}
{% block title %}{{ action }} Subject{% endblock %}
{% block page_title %}{{ action }} Subject{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="data-table">
            <div class="table-header">
                <h5 class="table-title">{{ action }} Subject</h5>
            </div>
            <div class="p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Subject Name *</label>
                        <input type="text" name="name" class="form-control" value="{{ subject.name }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Subject Code *</label>
                        <input type="text" name="code" class="form-control" value="{{ subject.code }}" required>
                        <small class="text-muted">e.g., CHM111, MTH101</small>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Description</label>
                        <textarea name="description" class="form-control" rows="4">{{ subject.description }}</textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-2"></i>Save Subject
                        </button>
                        <a href="{% url 'learning:custom_subject_list' %}" class="btn btn-secondary">
                            <i class="bi bi-x-circle me-2"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
