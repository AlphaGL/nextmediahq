{% extends 'news/base.html' %}
{% load static %}

{% block title %}Server Error - NextMedia{% endblock %}

{% block content %}
<section class="error-section">
    <div class="container">
        <div class="error-content">
            <div class="error-number">
                <span class="five">5</span>
                <span class="zero">0</span>
                <span class="zero">0</span>
            </div>
            
            <div class="error-message">
                <h1>Internal Server Error</h1>
                <p>Something went wrong on our end. Our team has been notified and is working to fix the issue.</p>
            </div>
            
            <div class="error-actions">
                <a href="{% url 'news:home' %}" class="error-btn primary">
                    <i class="fas fa-home"></i>
                    Go to Homepage
                </a>
                <button onclick="window.history.back()" class="error-btn secondary">
                    <i class="fas fa-arrow-left"></i>
                    Go Back
                </button>
            </div>
        </div>
    </div>
</section>
{% endblock %}
