<!-- Monetag Direct Link tab-under: ANY click (links, posts, search bar,
     navigation, plain page) opens the visitor's intended page in a NEW
     focused tab while this tab is sent to the ad in the background. -->
<script>
(function () {
    var AD_URL = 'https://omg10.com/4/11262581';
    // Cooldown between pops per visitor. 10 min default.
    // Lower to show more often; 0 = every single click (not recommended).
    var FREQUENCY_MS = 10 * 60 * 1000;
    var STORAGE_KEY = 'mt_pop_last';

    function alreadyShown() {
        try {
            var last = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
            return (Date.now() - last) < FREQUENCY_MS;
        } catch (e) {
            return false;
        }
    }

    document.addEventListener('click', function (e) {
        if (alreadyShown()) return;

        var target = (e.target && e.target.closest) ? e.target : null;
        var link = target ? target.closest('a') : null;
        var destination = window.location.href;

        // Real links keep their destination; everything else
        // (search bar, buttons, nav toggles, plain content)
        // reopens the current page in the new tab.
        if (link && /^https?:/i.test(link.href || '')) {
            destination = link.href;
        }

        // New tab = the visitor's own page on this site (gets focus)
        var siteTab = window.open(destination, '_blank');
        if (!siteTab) return; // popup blocked -> let the click behave normally

        e.preventDefault();
        e.stopPropagation();

        try { localStorage.setItem(STORAGE_KEY, String(Date.now())); } catch (err) {}

        // This tab (now in the background) goes to the ad
        window.location.href = AD_URL;
    }, true);
})();
</script>
