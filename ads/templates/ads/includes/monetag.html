<!-- Monetag Direct Link tab-under: on first click, the visitor's intended page
     opens in a NEW focused tab (so they stay on the site) while this tab is
     sent to the ad in the background. Capped to once per hour per visitor. -->
<script>
(function () {
    var AD_URL = 'https://omg10.com/4/11262581';
    var FREQUENCY_MS = 60 * 60 * 1000; // once per hour; lower to show more often
    var STORAGE_KEY = 'mt_pop_last';

    function alreadyShown() {
        try {
            var last = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
            return (Date.now() - last) < FREQUENCY_MS;
        } catch (e) {
            return false;
        }
    }

    document.addEventListener('click', function (e) {
        if (alreadyShown()) return;

        // Never hijack form fields, buttons or anything inside a form
        // (logins, payments, exam answers must keep working normally)
        if (e.target.closest('form, input, textarea, select, button, label')) return;

        var link = e.target.closest('a');
        var destination;

        if (link) {
            var href = link.getAttribute('href') || '';
            if (!href || href.charAt(0) === '#' ||
                href.indexOf('javascript:') === 0 ||
                href.indexOf('mailto:') === 0 ||
                href.indexOf('tel:') === 0 ||
                link.hasAttribute('download')) {
                return;
            }
            destination = link.href;
        } else {
            // Click on plain page content: reopen the current page in the new tab
            destination = window.location.href;
        }

        // New tab = the visitor's own page on this site (gets focus)
        var siteTab = window.open(destination, '_blank');
        if (!siteTab) return; // popup blocked -> let the click behave normally

        e.preventDefault();
        e.stopPropagation();

        try { localStorage.setItem(STORAGE_KEY, String(Date.now())); } catch (err) {}

        // This tab (now in the background) goes to the ad
        window.location.href = AD_URL;
    }, true);
})();
</script>
