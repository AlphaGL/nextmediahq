{% extends 'news/base.html' %}
{% load static %}

{% block title %}Payment Failed - NextMedia{% endblock %}

{% block content %}
<style>
    .failed-container {
        max-width: 600px;
        margin: 100px auto;
        padding: 20px;
        text-align: center;
    }
    
    .failed-box {
        background: var(--card-bg);
        padding: 50px;
        border-radius: 20px;
        box-shadow: 0 15px 50px var(--shadow);
    }
    
    .failed-icon {
        font-size: 5rem;
        color: #f44336;
        margin-bottom: 20px;
        animation: shake 0.5s ease;
    }
    
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
    }
    
    .failed-box h1 {
        color: var(--text-primary);
        font-size: 2rem;
        margin-bottom: 15px;
    }
    
    .failed-box p {
        color: var(--text-secondary);
        font-size: 1.1rem;
        margin-bottom: 30px;
    }
    
    .error-message {
        background: rgba(244, 67, 54, 0.1);
        border: 2px solid #f44336;
        color: #f44336;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 30px;
    }
    
    .action-buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
    }
    
    .btn {
        padding: 15px 30px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 700;
        transition: all 0.3s ease;
    }
    
    .btn-primary {
        background: var(--accent);
        color: var(--primary-bg);
    }
    
    .btn-primary:hover {
        background: var(--accent-secondary);
        transform: translateY(-2px);
    }
    
    .btn-secondary {
        background: var(--secondary-bg);
        color: var(--text-primary);
        border: 2px solid var(--border);
    }
    
    .btn-secondary:hover {
        border-color: var(--accent);
    }
</style>

<div class="failed-container">
    <div class="failed-box">
        <div class="failed-icon">
            <i class="fas fa-times-circle"></i>
        </div>
        
        <h1>Payment Failed</h1>
        <p>We couldn't process your payment</p>
        
        {% if message %}
        <div class="error-message">
            <i class="fas fa-exclamation-triangle"></i> {{ message }}
        </div>
        {% endif %}
        
        <div class="action-buttons">
            <a href="{{ request.META.HTTP_REFERER|default:'/tickets/' }}" class="btn btn-primary">
                <i class="fas fa-redo"></i> Try Again
            </a>
            <a href="{% url 'tickets:events_home' %}" class="btn btn-secondary">
                <i class="fas fa-home"></i> Back to Events
            </a>
        </div>
    </div>
</div>
{% endblock %}
